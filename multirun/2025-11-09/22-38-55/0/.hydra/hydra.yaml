hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      seed: '0'
      agent_config.globals.device: mps
      agent_config.agent_config.actor_updater.action_penalization: 'False'
      agent_config.agent_config.actor_updater.epsilon: '1'
      agent_config.agent_config.model.actor.head.num_diffusion_steps: '2'
      agent_config.agent_config.model.actor.head.rho: '7'
      agent_config.agent_config.model.actor.head.sampler_type: ddim
      agent_config.globals.sigma_max: '80'
      agent_config.globals.sigma_min: '0.002'
      agent_config.agent_config.actor_updater.sigma_mean: '-1.2'
      agent_config.agent_config.actor_updater.sigma_std: '1.2'
      agent_config.agent_config.actor_updater.density_type: lognormal
      agent_config.agent_config.critic_updater.name: DiffusionExpectedSARSA
      agent_config.agent_config.model.critic.head.name: ValueHead
      agent_config.agent_config.replay_updater.steps_before_batches: '1000'
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra: []
    task:
    - seed=0
    - agent_config.globals.device=mps
    - agent_config.agent_config.actor_updater.action_penalization=False
    - agent_config.agent_config.actor_updater.epsilon=1
    - agent_config.agent_config.model.actor.head.num_diffusion_steps=2
    - agent_config.agent_config.model.actor.head.rho=7
    - agent_config.agent_config.model.actor.head.sampler_type=ddim
    - agent_config.globals.sigma_max=80
    - agent_config.globals.sigma_min=0.002
    - agent_config.agent_config.actor_updater.sigma_mean=-1.2
    - agent_config.agent_config.actor_updater.sigma_std=1.2
    - agent_config.agent_config.actor_updater.density_type=lognormal
    - agent_config.agent_config.critic_updater.name=DiffusionExpectedSARSA
    - agent_config.agent_config.model.critic.head.name=ValueHead
    - agent_config.agent_config.replay_updater.steps_before_batches=1000
  job:
    name: run_tonic
    chdir: null
    override_dirname: agent_config.agent_config.actor_updater.action_penalization=False,agent_config.agent_config.actor_updater.density_type=lognormal,agent_config.agent_config.actor_updater.epsilon=1,agent_config.agent_config.actor_updater.sigma_mean=-1.2,agent_config.agent_config.actor_updater.sigma_std=1.2,agent_config.agent_config.critic_updater.name=DiffusionExpectedSARSA,agent_config.agent_config.model.actor.head.num_diffusion_steps=2,agent_config.agent_config.model.actor.head.rho=7,agent_config.agent_config.model.actor.head.sampler_type=ddim,agent_config.agent_config.model.critic.head.name=ValueHead,agent_config.agent_config.replay_updater.steps_before_batches=1000,agent_config.globals.device=mps,agent_config.globals.sigma_max=80,agent_config.globals.sigma_min=0.002,seed=0
    id: '0'
    num: 0
    config_name: exp14
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /Users/batin13/Desktop/KIT/MPO/dmpo/tonic
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/batin13/Desktop/KIT/MPO/dmpo/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/batin13/Desktop/KIT/MPO/dmpo/tonic/multirun/2025-11-09/22-38-55/0
    choices:
      wandb_config: diffusion_wandb
      trainer_config: trainer_config
      agent_config: dmpo_karras_delayQ
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
